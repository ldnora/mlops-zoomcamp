[project]
name = "mlops-zoomcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leandro Dalla Nora", email = "workdallanora@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.115",
    "fastparquet>=2026.9.0",
    "hyperopt>=0.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "protobuf>=7.36.2",
    "pyarrow>=4.0.0,<24",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[project.scripts]
mlops-zoomcamp = "mlops_zoomcamp:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false


[tool.uv.extra-build-dependencies]
pandas = ["pkg_resources"]
